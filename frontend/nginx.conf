server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    resolver 127.0.0.11 valid=10s;   # DNS interno de Docker
    set $backend ${BACKEND_URL};
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $backend;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
